<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <clipPath id="margin-clip">
      <rect width="100" height="100" rx="22" />
    </clipPath>
  </defs>
  <!-- Dark background container -->
  <rect width="100" height="100" rx="22" fill="#080b12" />
  <!-- Notebook margin line -->
  <g clip-path="url(#margin-clip)">
    <line x1="22" y1="0" x2="22" y2="100" stroke="#1d4ed8" stroke-width="2.5" />
  </g>
  <!-- Editorial Serif Italic M -->
  <text
    x="59"
    y="71"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
    font-size="63"
    font-style="italic"
    font-weight="normal"
  >M</text>
</svg>
